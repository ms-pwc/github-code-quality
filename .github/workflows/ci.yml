name: CI and coverage

on:
  push:
    branches:
      - main
      - sonarqube-poc
      - github-native-poc
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  code-quality: write

jobs:
  test:
    name: Build, test, and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore CodeQualityPoc.sln

      - name: Build
        run: dotnet build CodeQualityPoc.sln --configuration Release --no-restore

      - name: Test with Cobertura coverage
        run: >-
          dotnet test tests/QualityDemo.Tests/QualityDemo.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/artifacts/coverage/coverage
          /p:CoverletOutputFormat=cobertura
          /p:ExcludeByFile=**/Program.cs

      - name: Enforce 80% pull-request coverage
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: >-
          ./scripts/Test-CoverageThreshold.ps1
          -CoverageFile artifacts/coverage/coverage.cobertura.xml
          -MinimumPercent 80

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-${{ github.run_id }}
          path: |
            **/TestResults/*.trx
            artifacts/coverage/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload coverage to GitHub Code Quality
        if: >-
          success() &&
          (github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/github-native-poc' ||
          github.event_name == 'pull_request')
        uses: actions/upload-code-coverage@v1
        with:
          file: artifacts/coverage/coverage.cobertura.xml
          language: C#
          label: code-coverage/dotnet