name: Build

on:
  push:
    branches:
      - main
      - github-native-poc-manual-reapply
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore CodeQualityPoc.sln

      - name: Build
        run: dotnet build CodeQualityPoc.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CodeQualityPoc.sln --configuration Release --no-build
